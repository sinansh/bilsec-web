{%- assign _tel = site.iletisim.telefon | default: "" -%}{%- assign _acil = site.iletisim.acil_telefon | default: "" -%}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":{{ site.kurum.unvan | jsonify }},"alternateName":{{ site.kurum.ad | jsonify }},"url":{{ '/' | absolute_url | jsonify }},"logo":{{ site.kurum.logo | absolute_url | jsonify }},"email":{{ site.iletisim.eposta | jsonify }},{% if _tel != "" %}"telephone":{{ _tel | jsonify }},{% endif %}"address":{"@type":"PostalAddress","streetAddress":{{ site.iletisim.adres.sokak | jsonify }},"addressLocality":{{ site.iletisim.adres.ilce | jsonify }},"addressRegion":{{ site.iletisim.adres.il | jsonify }},"postalCode":{{ site.iletisim.adres.posta_kodu | jsonify }},"addressCountry":{{ site.iletisim.adres.ulke | jsonify }}},"contactPoint":[{"@type":"ContactPoint","contactType":"customer support",{% if _tel != "" %}"telephone":{{ _tel | jsonify }},{% endif %}"email":{{ site.iletisim.eposta | jsonify }},"availableLanguage":"tr"}{% if _acil != "" %},{"@type":"ContactPoint","contactType":"emergency","telephone":{{ _acil | jsonify }},"availableLanguage":"tr"}{% endif %}],"areaServed":{"@type":"Country","name":"Türkiye"},"knowsAbout":{{ site.kurum.uzmanlik | jsonify }},"sameAs":{{ site.sosyal | map: "url" | jsonify }}}</script>
